spring:
  datasource:
    url: jdbc:mysql://${db_host}:${db_port}/${db_name}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username:
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect


logging:
  level:
    org:
      springframework:
        security:
          TRACE
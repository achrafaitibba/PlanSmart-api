version: '3.8'

services:
  api:
    image: ghcr.io/achrafaitibba/plansmart:latest
    restart: always
    environment:
      VIRTUAL_HOST: api-dev.plansmart.me
      LETSENCRYPT_HOST: api-dev.plansmart.me
      LETSENCRYPT_EMAIL: aitibbaachraf@gmail.com
      DB_NAME: ${DB_NAME}
      DB_HOST: mysql
      B_PORT: 3306
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_ROOT_PASSWORD}
    networks:
      - nginx-proxy-network
      - app-network
    depends_on:
      - mysql

  mysql:
    image: mysql:8.2.0
    container_name: Plan-Smart-DB
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3308:3306" #3307:3306/tcp
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network


volumes:
  mysql_data:

networks:
  nginx-proxy-network:
    external: true
  app-network:
    driver: bridge
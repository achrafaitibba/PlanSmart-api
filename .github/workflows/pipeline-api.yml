name: PlanSmart Api Deployment

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/*.yml'
      - 'src/**'
      - 'Dockerfile'
      - 'docker-compose.*.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: plansmart
  COMPOSE_FILE_API: docker-compose.api.yml
  COMPOSE_FILE_DB: docker-compose.db.yml
  DOCKERFILE: Dockerfile
  APP_DIR: /home/apps/plansmart

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure directory exists on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: mkdir -p ${{ env.APP_DIR }}

      - name: Copy compose files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: |
            ${{ env.COMPOSE_FILE_API }}
            ${{ env.COMPOSE_FILE_DB }}
          target: ${{ env.APP_DIR }}/

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ${{ env.REGISTRY }} \
              -u ${{ secrets.GHCR_USERNAME }} --password-stdin
            cd ${{ env.APP_DIR }}

            # Create external networks if they don't exist
            docker network create nginx-proxy-network || true
            docker network create app-network || true

            # Start MySQL if not already running
            if [ -z "$(docker ps -q -f name=plansmart-mysql)" ]; then
              docker compose -f ${{ env.COMPOSE_FILE_DB }} up -d
            fi

            # Wait for MySQL to be healthy
            MYSQL_CONTAINER=$(docker compose -f ${{ env.COMPOSE_FILE_DB }} ps -q mysql)
            while [ "$(docker inspect -f '{{.State.Health.Status}}' $MYSQL_CONTAINER)" != "healthy" ]; do
              sleep 5
              echo "Waiting for MySQL to become healthy..."
            done

            # Determine current color
            CURRENT_COLOR_FILE="${{ env.APP_DIR }}/current_color"
            if [ -f "$CURRENT_COLOR_FILE" ]; then
              CURRENT_COLOR=$(cat $CURRENT_COLOR_FILE)
              NEW_COLOR="green"
              if [ "$CURRENT_COLOR" == "green" ]; then
                NEW_COLOR="blue"
              fi
            else
              NEW_COLOR="blue"
            fi

            # Pull new image
            docker compose -f ${{ env.COMPOSE_FILE_API }} pull api

            # Start new containers
            docker compose -p $NEW_COLOR -f ${{ env.COMPOSE_FILE_API }} up -d api

            # Wait for new API container to be healthy
            NEW_API_CONTAINER=$(docker compose -p $NEW_COLOR -f ${{ env.COMPOSE_FILE_API }} ps -q api)
            if [ -n "$NEW_API_CONTAINER" ]; then
              while [ "$(docker inspect -f '{{.State.Health.Status}}' $NEW_API_CONTAINER)" != "healthy" ]; do
                sleep 5
                echo "Waiting for new API container to become healthy..."
              done
            else
              echo "Error: New API container not found!"
              exit 1
            fi

            # Stop old containers
            if [ -n "$CURRENT_COLOR" ]; then
              docker compose -p $CURRENT_COLOR -f ${{ env.COMPOSE_FILE_API }} down
            fi

            # Update current color
            echo $NEW_COLOR > $CURRENT_COLOR_FILE